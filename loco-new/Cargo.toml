[workspace]

[package]
name = "loco"
version = "1.1.0"
edition = "2024"
# Its own workspace, so it cannot inherit the root's `rust-version`. Kept in
# step with it by hand — the `msrv` CI job checks both against the root value.
rust-version = "1.94"
description = "Loco new app generator"
license = "Apache-2.0"
homepage = "https://loco.rs/"
documentation = "https://docs.rs/loco"
# Without this, the crates.io page for the binary most users install has no
# link back to the source.
repository = "https://github.com/loco-rs/loco"
keywords = ["loco", "scaffold", "generator", "cli", "rails"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
readme = "README.md"
# `include` is exhaustive: anything not matched here is absent from the
# published crate, and the CLI reads `base_template/` at generation time.
include = ["src/**", "base_template/**", "Cargo.toml", "setup.rhai", "LICENSE"]

[features]
test-wizard = []

[profile.release]
strip = true

[[bin]]
name = "loco"
path = "src/bin/main.rs"
required-features = []


[dependencies]
thiserror = { version = "2.0" }
clap = { version = "4.4.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
heck = { version = "0.5.0" }
dialoguer = "0.11.0"
strum = { version = "0.27", features = ["derive"] }
unicode-xid = { version = "0.2.6" }
rhai = { version = "1.25" }
include_dir = { version = "0.7.4" }
fs_extra = { version = "1.3.0" }
walkdir = { version = "2.5.0" }
tera = { version = "1.20.0" }
colored = { version = "3" }
duct = { version = "1.0" }
rand = { version = "0.9" }
tree-fs = { version = "0.3" }

[dev-dependencies]
uuid = { version = "1.11.0", features = ["v4", "fast-rng"] }
semver = { version = "1" }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
insta = { version = "1.41.1", features = ["redactions", "yaml", "filters"] }
rstest = { version = "0.26.1" }
serial_test = "3"
mockall = "0.13.0"
toml = "0.8.19"
regex = "1.11.1"
