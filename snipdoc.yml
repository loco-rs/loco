snippets:
  description:
    content: 🚂 Roco is Rust on Rails.
    path: ./snipdoc.yml
  help-command:
    content: cargo roco --help
    path: ./snipdoc.yml
  exec-help-command:
    content: cargo roco --help
    path: ./snipdoc.yml
  build-command:
    content: cargo build --release
    path: ./snipdoc.yml
  quick-installation-command:
    content: |-
      cargo install roco
      cargo install sea-orm-cli # Only when DB is needed
    path: ./snipdoc.yml
  roco-cli-new-from-template:
    content: |-
      ❯ roco new
      ✔ ❯ App name? · myapp
      ✔ ❯ What would you like to build? · Saas App with client side rendering
      ✔ ❯ Select a DB Provider · Sqlite
      ✔ ❯ Select your background worker type · Async (in-process tokio async tasks)

      🚂 Roco app generated successfully in:
      myapp/

      - assets: You've selected `clientside` for your asset serving configuration.

      Next step, build your frontend:
        $ cd frontend/
        $ npm install && npm run build

    path: ./snipdoc.yml
  postgres-run-docker-command:
    content: |-
      docker run -d -p 5432:5432 \
        -e POSTGRES_USER=roco \
        -e POSTGRES_DB=myapp_development \
        -e POSTGRES_PASSWORD="roco" \
        postgres:15.3-alpine
    path: ./snipdoc.yml
  redis-run-docker-command:
    content: docker run -p 6379:6379 -d redis redis-server
    path: ./snipdoc.yml
  starting-the-server-command:
    content: cargo roco start
    path: ./snipdoc.yml
  starting-the-server-command-with-environment-env-var:
    content: ROCO_ENV=qa cargo roco start
    path: ./snipdoc.yml
  starting-the-server-command-with-output:
    content: |-
      $ cargo roco start

                            ▄     ▀
                                      ▀  ▄
                        ▄       ▀     ▄  ▄ ▄▀
                                          ▄ ▀▄▄
                              ▄     ▀    ▀  ▀▄▀█▄
                                                ▀█▄
      ▄▄▄▄▄▄▄  ▄▄▄▄▄▄▄▄▄   ▄▄▄▄▄▄▄▄▄▄▄ ▄▄▄▄▄▄▄▄▄ ▀▀█
      ██████  █████   ███ █████   ███ █████   ███ ▀█
      ██████  █████   ███ █████   ▀▀▀ █████   ███ ▄█▄
      ██████  █████   ███ █████       █████   ███ ████▄
      ██████  █████   ███ █████   ▄▄▄ █████   ███ █████
      ██████  █████   ███  ████   ███ █████   ███ ████▀
        ▀▀▀██▄ ▀▀▀▀▀▀▀▀▀▀  ▀▀▀▀▀▀▀▀▀▀  ▀▀▀▀▀▀▀▀▀▀ ██▀
            ▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀
                      https://rsonroco.com

      listening on port 5150
    path: ./snipdoc.yml
  doctor-command:
    content: |-
      $ cargo roco doctor
          Finished dev [unoptimized + debuginfo] target(s) in 0.32s
          Running `target/debug/myapp-cli doctor`
      ✅ SeaORM CLI is installed
      ✅ DB connection: success
      ✅ Redis connection: success
    path: ./snipdoc.yml
  generate-deployment-command:
    content: |-
      cargo roco generate deployment docker     
      
      added: "Dockerfile"
      added: ".dockerignore"
      * Dockerfile generated successfully.
      * Dockerignore generated successfully
    path: ./snipdoc.yml
  scaffold-help-command:
    content: cargo roco generate scaffold --help
    path: ./snipdoc.yml
  scaffold-post-command:
    content: cargo roco generate scaffold posts
      name:string title:string content:text --api
    path: ./snipdoc.yml
  generate-task-help-command:
    content: cargo roco generate task --help
    path: ./snipdoc.yml
  run-task-command:
    content: cargo roco task <TASK_NAME>
    path: ./snipdoc.yml
  list-tasks-command:
    content: cargo roco task
    path: ./snipdoc.yml
  migrate-down-command:
    content: cargo roco db down
    path: ./snipdoc.yml
  migrate-down-n-command:
    content: cargo roco db down 2
    path: ./snipdoc.yml
  scheduler-generate-command:
    content: cargo roco generate scheduler
    path: ./snipdoc.yml
  scheduler-list-command:
    content: cargo roco scheduler --list
    path: ./snipdoc.yml
  scheduler-list-from-file-command:
    content: cargo roco scheduler --config config/scheduler.yaml --list
    path: ./snipdoc.yml
  scheduler-list-from-env-setting-command:
    content: ROCO_ENV=production cargo roco scheduler --list
    path: ./snipdoc.yml
  scheduler-run-job-by-name-command:
    content: ROCO_ENV=production cargo roco scheduler --name 'JOB_NAME'
    path: ./snipdoc.yml
  scheduler-run-job-by-tag-command:
    content: ROCO_ENV=production cargo roco scheduler --tag 'maintenance'
    path: ./snipdoc.yml
  cli-middleware-list:
    content: cargo roco middleware --config
    path: ./snipdoc.yml
  jobs-help-command:
    content: cargo roco jobs --help
    path: ./snipdoc.yml
  seed-help-command:
    content: cargo roco db seed --help
    path: ./snipdoc.yml
