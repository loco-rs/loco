[workspace]
members = ["xtask", "loco-gen"]
exclude = ["starters", "examples"]

[workspace.package]
edition = "2024"
# MSRV floor raised for Sea-ORM 2.0 + sqlx 0.9: sea-orm 2.0.0 declares rustc
# 1.94 as its own MSRV, so we match it.
# Edition 2024 needs rustc >= 1.85, satisfied by the 1.94 floor above.
rust-version = "1.94"
license = "Apache-2.0"

[package]
name = "loco-rs"
version = "1.2.0"
description = "The one-person framework for Rust"
homepage = "https://loco.rs/"
documentation = "https://docs.rs/loco-rs"
repository = "https://github.com/loco-rs/loco"
keywords = ["web", "framework", "rails", "api", "backend"]
categories = ["web-programming::http-server", "web-programming", "development-tools"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

# Without this the published .crate carries the documentation site — a large
# share of the download that no consumer of the library needs. `examples/`,
# `xtask/`, `loco-new/` and `loco-gen/` are already left out automatically as
# nested packages.
exclude = [
    "website/",
    "media/",
    ".vscode/",
    ".github/",
    "snipdoc.yml",
    "AGENTS.md",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = [
    "auth",
    "cli",
    "with-db",
    "cache_inmem",
    "worker",
    "db-sqlite",
    "db-postgres",
    "compression",
    "generators",
    "mailer",
]
# Email: the `Mailer` trait, SMTP delivery and the mailer queue worker. lettre
# brings an SMTP parser and a rustls TLS stack; an app that sends no mail
# (the no-database starter) leaves this off.
mailer = ["dep:lettre", "dep:include_dir"]
# HS256/384/512 JWTs on RustCrypto HMAC; pure Rust, no C toolchain.
# It also carries argon2 password hashing.
auth = ["dep:hmac", "dep:sha2", "dep:base64", "dep:argon2"]
cli = ["dep:clap"]
testing = ["testing-core", "testing-html"]
# Request, mailer and DB test helpers, without the HTML selector assertions.
# Generated apps use this: `scraper`'s dependency tree turns on extra features
# of `derive_more` and `stable_deref_trait`, crates that sea-orm and url also
# use, so with it `cargo test` recompiles ~60 crates `cargo build` already built.
testing-core = ["dep:axum-test", "dep:tree-fs"]
# `assert_css_*` HTML selector assertions (pulls in `scraper`).
testing-html = ["testing-core", "dep:scraper"]
with-db = [
    "dep:toml",
    "dep:sea-orm",
    "dep:sea-orm-migration",
    "dep:sqlx",
    "loco-gen?/with-db",
]
# SQLite SeaORM/sqlx drivers and the SQLite queue worker. Off by default when
# consumers use `default-features = false` (e.g. Postgres-only apps that skip
# libsqlite3-sys compile cost).
db-sqlite = [
    "sea-orm?/sqlx-sqlite",
    "sea-orm-migration?/sqlx-sqlite",
    "sqlx?/sqlite",
]
# Postgres SeaORM/sqlx drivers and the Postgres queue worker. Leave it out with
# `default-features = false` for SQLite-only apps, which then skip
# `sqlx-postgres` and its crypto/unicode dependencies.
db-postgres = [
    "sea-orm?/sqlx-postgres",
    "sea-orm-migration?/sqlx-postgres",
    "sqlx?/postgres",
]
# `cargo loco generate` (debug builds only). Pulls `loco-gen` and, through
# `rrgen`, a second (Tera 1) template engine; release builds never use it.
generators = ["dep:loco-gen"]
# The `compression` middleware. `compression` is gzip only, which every client
# accepts, and is the default. `compression-full` adds brotli, deflate and zstd;
# zstd is a C build and brotli a large one, together more compile time than the
# rest of tower-http.
compression = ["tower-http/compression-gzip"]
compression-full = ["compression", "tower-http/compression-full"]
# Explicit tenant scoping for Sea-ORM models and queries.
multi-tenancy = ["with-db"]
# Storage features
all_storage = ["storage_aws_s3", "storage_azure", "storage_gcp"]
# The local and in-memory drivers are plain tokio; OpenDAL comes in only for
# the cloud backends, or for wrapping another OpenDAL service yourself with
# `drivers::opendal_adapter`.
storage_opendal = ["dep:opendal"]
storage_aws_s3 = ["storage_opendal", "opendal/services-s3"]
storage_azure = ["storage_opendal", "opendal/services-azblob"]
storage_gcp = ["storage_opendal", "opendal/services-gcs"]
# Cache feature
cache_inmem = []
cache_redis = ["dep:bb8-redis", "dep:bb8"]
worker = ["dep:sqlx", "dep:ulid"]
worker_redis = ["worker", "dep:redis"]
# Redis over TLS (`rediss://`) for managed providers (ElastiCache, Upstash,
# Azure Cache, ...). Arms both the worker and cache redis paths — the same
# `redis` crate, unified by Cargo — with webpki-bundled roots (portable to
# slim/distroless images). Enable alongside `worker_redis`/`cache_redis` and
# use a `rediss://` URL in config; no code changes required. See `dep:rustls`
# above for why the provider is pinned to ring.
redis_tls = ["redis/tokio-rustls-comp", "redis/tls-rustls-webpki-roots", "dep:rustls"]
# Embed assets into binary
embedded_assets = []

[dependencies]
loco-gen = { version = "1.2.0", path = "./loco-gen", optional = true }
backtrace_printer = { version = "1.3.0" }

# cli
clap = { version = "4.4.7", features = ["derive"], optional = true }
colored = { workspace = true }
sea-orm = { version = "2.0", features = [
    "runtime-tokio-rustls",
    "macros",
], optional = true }

tokio = { version = "1.45", default-features = false, features = ["fs", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
# the rest

serde = { workspace = true }
serde_json = { workspace = true }
# serde_yaml (dtolnay) is archived; serde_yaml_ng is the maintained, drop-in
# continuation. Kept under the `serde_yaml` name so source paths are unchanged.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
serde_variant = "0.1.2"
# Reads `[package.metadata.db.entity]` for `cargo loco db entities`.
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"], optional = true }

async-trait = { workspace = true }

axum = { workspace = true }
axum-extra = { version = "0.10", features = ["cookie"] }
regex = { workspace = true }
# mailer
tera = { workspace = true }
heck = { workspace = true }
cruet = "1.0"
lettre = { version = "0.11.4", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1-rustls-tls",
], optional = true }
include_dir = { version = "0.7.3", optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.16", default-features = false, features = [
    "env-filter",
    "json",
    "ansi",
] }
tracing-appender = { version = "0.2.3", default-features = false }

duct = { workspace = true }

tower-http = { workspace = true }

argon2 = { version = "0.5", features = ["std"], optional = true }
rand = { version = "0.9", features = ["std"] }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
validator = { version = "0.20.0", features = ["derive"] }
futures-util = "0.3"
tower = { workspace = true }
bytes = "1.11"
axum-client-ip = { version = "1.3", features = ["forwarded-header"] }
semver = { version = "1", features = ["serde"] }
url = "2"

axum-test = { version = "17.0.1", optional = true }
tree-fs = { version = "0.3", optional = true }

chrono = { workspace = true }

uuid = { version = "1.10.0", features = ["v4", "fast-rng"] }

# File Upload
opendal = { version = "0.58.1", default-features = false, features = [
    "layers-retry",
], optional = true }
http = "1"

# cache
bb8-redis = { version = "0.26", optional = true }
bb8 = { version = "0.9", optional = true }

# Scheduler
english-to-cron = { version = "0.1.2" }

# worker: pg + sqlite backed queue workers.
# `tls-rustls-ring-webpki` gives the standalone pg/sqlite worker pool a TLS
# backend on its own (matching sea-orm's `runtime-tokio-rustls`), so a
# worker-only build — a pg queue without `with-db` — can still reach a
# TLS-only managed Postgres. In `with-db` builds this unifies with sea-orm's
# ring-based rustls. Managed Postgres TLS is then opt-in purely via the
# connection URL (`sslmode=require`, `sslrootcert=...`); see the how-to docs.
sqlx = { version = "0.9", default-features = false, features = [
    "json",
    "chrono",
    "tls-rustls-ring-webpki",
], optional = true }
ulid = { version = "1", optional = true }

# worker_redis: redis backed queue workers
redis = { version = "1", features = ["aio", "tokio-comp"], optional = true }
# `redis_tls` only: redis' TLS path calls `rustls::ClientConfig::builder()`,
# which resolves rustls' *process-default* crypto provider at build time. redis
# pulls rustls with no provider of its own, so we bring rustls with the
# pure-Rust `ring` provider (no C toolchain — matching Loco's zero-friction
# onboarding) to guarantee a provider is compiled in even for redis-only builds.
# Unifies with sea-orm/sqlx, which also select ring.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
], optional = true }

scraper = { version = "0.25.0", features = ["deterministic"], optional = true }

dashmap = "6"
notify = "8.1.0"

[workspace.dependencies]
tera = { version = "2.1", features = ["glob_fs"] }
colored = { version = "3.0" }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1.40"
regex = "1"
thiserror = "2"
serde = "1"
serde_json = "1"
async-trait = { version = "0.1.74" }
axum = { version = "0.8.1", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6.8", features = [
    "trace",
    "catch-panic",
    "timeout",
    "add-extension",
    "cors",
    "fs",
    "set-header",
] }
heck = "0.5.0"
duct = { version = "1.0.0" }

[dependencies.sea-orm-migration]
optional = true
version = "2.0"
# Its default `cli` feature builds sea-orm-cli; Loco runs migrations itself.
default-features = false
features = [
    # Enable at least one `ASYNC_RUNTIME` and `DATABASE_DRIVER` feature if you want to run migration via CLI.
    # View the list of supported features at https://www.sea-ql.org/SeaORM/docs/install-and-config/database-and-async-runtime.
    # e.g.
    "runtime-tokio-rustls", # `ASYNC_RUNTIME` feature
    # `DATABASE_DRIVER` features come from `db-postgres` / `db-sqlite`.
]

[package.metadata.docs.rs]
features = ["testing", "multi-tenancy"]

[dev-dependencies]
loco-rs = { path = ".", features = ["testing"] }
rstest = "0.26.1"
insta = { version = "1.34.0", features = ["filters"] }
tree-fs = { version = "0.3" }
reqwest = { version = "0.12.7", features = ["json"] }
tower = { workspace = true, features = ["util"] }
sqlx = { version = "0.9", default-features = false, features = [
    "macros",
    "json",
    "postgres",
    "chrono",
    "sqlite",
    "migrate",
] }
testcontainers = { version = "0.27" }
serial_test = { version = "3.5.0" }
