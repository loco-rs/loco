[package]
name = "xtask"
version = "0.2.0"
edition = "2024"

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/bin/main.rs"
required-features = []

[dependencies]
clap = { version = "4.4.7", features = ["derive"] }
eyre = "0.6"
duct = { workspace = true }
cargo_metadata = "0.23"
requestty = "0.5.0"
regex = { version = "1.10.2" }
thiserror = "2"
tabled = "0.21"
colored = { version = "3.0" }

[dev-dependencies]
